<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#07070D">
<title>Meu Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070D;--p1:#8B5CF6;--p2:#06B6D4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F4F4F8;transition:background .6s}
#app{position:fixed;top:0;left:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .6s}
#app.on{opacity:1}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);z-index:5;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.orb{width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;box-shadow:0 0 70px color-mix(in srgb,var(--p1) 60%,transparent);animation:pop .9s cubic-bezier(.2,1.4,.4,1),breath 2.4s ease-in-out .9s infinite}
.orb svg{width:50px;height:50px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
.bar{width:170px;height:4px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--p1),var(--p2));animation:ld 1.2s ease-in-out infinite}
small{color:#8A8AA6;font-size:13px}
#ajuda{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#ajuda.on{display:flex}
.card{max-width:380px;width:100%;text-align:center;padding:30px 24px;border-radius:28px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.card p{color:#A1A1B5;font-size:14.5px;line-height:1.55;margin:10px 0 20px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:800 15px 'Plus Jakarta Sans',sans-serif;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));margin-top:10px;text-decoration:none;cursor:pointer}
.btn.sec{background:rgba(255,255,255,.08)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
</style>
</head>
<body>
<div id="splash">
  <div class="orb"><svg viewBox="0 0 24 24" fill="#fff"><path d="M21 7.28V5c0-1.1-.9-2-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-2.28A2 2 0 0 0 22 15V9a2 2 0 0 0-1-1.72zM20 9v6h-7V9h7zM5 19V5h14v2h-6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6v2H5z"/><circle cx="16" cy="12" r="1.5"/></svg></div>
  <h1>Meu Financeiro</h1>
  <div class="bar"><i></i></div>
  <small id="msg">Abrindo…</small>
</div>

<div id="ajuda"><div class="card">
  <div class="orb" style="margin:0 auto 16px;width:70px;height:70px;border-radius:22px;animation:none"><svg viewBox="0 0 24 24" fill="#fff" style="width:34px;height:34px"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5S13.4 12 12 12s-2.5-1.1-2.5-2.5S10.6 7 12 7zm4.5 10h-9v-1c0-1.67 3-2.5 4.5-2.5s4.5.83 4.5 2.5v1z"/></svg></div>
  <h1>Entrar</h1>
  <p>Para ver seus dados, o app precisa da sua conta Google. Faça o login uma vez e volte para cá.</p>
  <a class="btn" id="bLogin" href="#" target="_blank">Entrar com Google</a>
  <button class="btn sec" onclick="recarregar()">Tentar de novo</button>
  <a class="btn sec" id="bDireto" href="#" target="_blank">Abrir painel no Safari</a>
</div></div>

<iframe id="app" allow="camera; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
// ▼▼▼ COLE AQUI O LINK DO SEU WEB APP (termina em /exec) ▼▼▼
var URL_APP = 'https://script.google.com/macros/s/AKfycbz-OslcfjubJedvRAFoEtSxoZvMnYjXlv9gW2i26mntS7_RxatEi95FKHjDLr44SReZgg/exec';
// ▲▲▲

var pronto = false, tLimite = null;
function $(i) { return document.getElementById(i); }
function aplicarCores(bg, p1, p2) {
  var r = document.documentElement.style;
  if (bg) { r.setProperty('--bg', bg); document.querySelector('meta[name=theme-color]').setAttribute('content', bg); }
  if (p1) r.setProperty('--p1', p1); if (p2) r.setProperty('--p2', p2);
  try { localStorage.setItem('mf_cores', JSON.stringify({ bg: bg, p1: p1, p2: p2 })); } catch (e) {}
}
function mostrarAjuda() { $('splash').classList.add('out'); $('ajuda').classList.add('on'); }
function carregar() {
  pronto = false; $('ajuda').classList.remove('on'); $('splash').classList.remove('out'); $('app').classList.remove('on');
  $('msg').textContent = 'Abrindo…';
  var sep = URL_APP.indexOf('?') > -1 ? '&' : '?';
  $('app').src = URL_APP + sep + 'app=1&t=' + Date.now();
  clearTimeout(tLimite);
  setTimeout(function () { if (!pronto) $('msg').textContent = 'Conectando à sua conta…'; }, 5000);
  tLimite = setTimeout(function () { if (!pronto) mostrarAjuda(); }, 15000);
}
function recarregar() { carregar(); }

window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.mf) return;
  if (d.mf === 'ready') {
    pronto = true; clearTimeout(tLimite);
    aplicarCores(d.bg, d.p1, d.p2);
    $('app').classList.add('on');
    setTimeout(function () { $('splash').classList.add('out'); }, 250);
  } else if (d.mf === 'login') {
    clearTimeout(tLimite); mostrarAjuda();
  } else if (d.mf === 'reload') {
    carregar();
  }
});

// volta do segundo plano depois de muito tempo → recarrega dados frescos
var saiu = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) saiu = Date.now();
  else if (saiu && Date.now() - saiu > 30 * 60 * 1000) carregar();
});

(function init() {
  try { var c = JSON.parse(localStorage.getItem('mf_cores') || '{}'); aplicarCores(c.bg, c.p1, c.p2); } catch (e) {}
  if (URL_APP.indexOf('/exec') === -1) { $('msg').textContent = 'Configure o link do Web App no index.html'; return; }
  $('bLogin').href = 'https://accounts.google.com/ServiceLogin?continue=' + encodeURIComponent(URL_APP);
  $('bDireto').href = URL_APP;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  carregar();
})();
</script>
</body>
</html>
