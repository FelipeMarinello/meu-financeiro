<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#0A0A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#07070D;--bg2:#0E0E19;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.09);--tx:#F4F4F8;--tx2:#A1A1B5;--tx3:#6B6B80;
--p1:#8B5CF6;--p2:#06B6D4;--p3:#EC4899;--ok:#10B981;--warn:#F59E0B;--bad:#EF4444;--grad:linear-gradient(135deg,var(--p1) 0%,var(--p2) 100%);--grad2:linear-gradient(135deg,var(--p3),var(--p1));
--r:22px;--sh:0 20px 60px -20px rgba(0,0,0,.6);--blur:blur(22px) saturate(160%)}
body.light{--bg:#F3F2F8;--bg2:#FFFFFF;--card:rgba(255,255,255,.75);--card2:rgba(255,255,255,.95);--bd:rgba(20,20,50,.08);--tx:#14142B;--tx2:#55557A;--tx3:#8A8AA6;--sh:0 20px 50px -25px rgba(60,40,140,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;transition:background .5s,color .5s;padding-bottom:env(safe-area-inset-bottom)}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;vertical-align:middle;font-variation-settings:'FILL' 1}
.mono{font-family:'JetBrains Mono',monospace}
/* fundo aurora animado */
.aurora{position:fixed;inset:-20%;z-index:-2;pointer-events:none;filter:blur(90px);opacity:.55}
.aurora i{position:absolute;width:45vw;height:45vw;border-radius:50%;animation:float 22s ease-in-out infinite}
.aurora i:nth-child(1){background:var(--p1);transition:background 1s;top:0;left:5%}
.aurora i:nth-child(2){background:var(--p2);transition:background 1s;top:30%;right:0;animation-delay:-7s}
.aurora i:nth-child(3){background:var(--p3);transition:background 1s;bottom:0;left:30%;animation-delay:-14s;opacity:.6}
body.light .aurora{opacity:.22}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(8vw,6vh) scale(1.15)}66%{transform:translate(-6vw,4vh) scale(.9)}}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.6}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes borda{to{--ang:360deg}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes scan{0%{top:6%}50%{top:90%}100%{top:6%}}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
/* loading */
#loader{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s,visibility .6s}
#loader.out{opacity:0;visibility:hidden}
.logoOrb{width:92px;height:92px;border-radius:28px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 60px rgba(139,92,246,.6);animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
.logoOrb .ms{font-size:46px;color:#fff}
.ldTxt{font-weight:800;font-size:22px;letter-spacing:-.5px}
.ldBar{width:180px;height:4px;border-radius:9px;background:var(--card2);overflow:hidden}
.ldBar i{display:block;height:100%;width:40%;background:var(--grad);border-radius:9px;animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
/* header */
header{position:sticky;top:0;z-index:50;padding:14px 22px;display:flex;align-items:center;gap:14px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.4px;white-space:nowrap}
.brand .mini{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center}
.brand .mini .ms{color:#fff;font-size:22px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:0}
nav.pills{display:flex;gap:4px;margin:0 auto;background:var(--card);border:1px solid var(--bd);padding:5px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
nav.pills::-webkit-scrollbar{display:none}
nav.pills button{border:0;background:none;color:var(--tx2);font:600 13px inherit;font-family:inherit;padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.25s}
nav.pills button .ms{font-size:18px}
nav.pills button:hover{color:var(--tx)}
nav.pills button.on{background:var(--grad);color:#fff;box-shadow:0 6px 20px -6px color-mix(in srgb,var(--p1) 80%,transparent)}
.hAct{display:flex;gap:8px;align-items:center}
.icBtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icBtn:hover{background:var(--card2);transform:translateY(-2px)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;animation:pulse 2s infinite}
.mesSel{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px}
.mesSel button{border:0;background:none;color:var(--tx2);cursor:pointer;width:32px;height:32px;border-radius:10px}
.mesSel button:hover{background:var(--card2);color:var(--tx)}
.mesSel span{font-weight:700;font-size:14px;min-width:84px;text-align:center;text-transform:capitalize}
/* layout */
main{max-width:1380px;margin:0 auto;padding:22px 22px 120px}
.page{display:none}
.page.on{display:block;animation:pgIn .4s cubic-bezier(.2,.8,.2,1)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-1px}
.hero p{color:var(--tx2);font-size:14px;margin-top:4px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh);opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .3s,border-color .3s}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--p1) 45%,transparent)}
.card h3{font-size:14px;font-weight:700;color:var(--tx2);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 .ms{font-size:19px;color:var(--p1)}
.card h3 .sp{margin-left:auto}
.glow{position:relative;overflow:hidden}
.glow::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 60%,var(--p1),var(--p2),var(--p3),transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borda 5s linear infinite;pointer-events:none}
/* KPI */
.kpi .lbl{font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:800;letter-spacing:-1px;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .bar{position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 6px 6px 0}
.kpi .ico{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;opacity:.95}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2)}
.chip.ok{color:var(--ok);background:rgba(16,185,129,.13)}.chip.bad{color:var(--bad);background:rgba(239,68,68,.13)}.chip.warn{color:var(--warn);background:rgba(245,158,11,.14)}.chip.pp{color:#A78BFA;background:rgba(139,92,246,.15)}
/* hero saldo */
.saldoHero{padding:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--p1) 28%,transparent),color-mix(in srgb,var(--p2) 14%,transparent) 60%,color-mix(in srgb,var(--p3) 18%,transparent));}
.saldoHero .big{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:8px 0;font-variant-numeric:tabular-nums}
.saldoHero .row3{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.saldoHero .row3 div small{display:block;font-size:11.5px;color:var(--tx2);font-weight:600}
.saldoHero .row3 div b{font-size:18px}
.flow{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex;margin-top:18px}
.flow i{height:100%;transition:width 1.4s cubic-bezier(.2,.8,.2,1);width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
/* gauge */
.gauge{position:relative;width:170px;height:170px;margin:0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .gv b{font-size:40px;font-weight:800;letter-spacing:-1.5px}
.gauge .gv small{font-size:12px;color:var(--tx2);font-weight:600}
.gauge circle{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
/* cartões de crédito 3D */
.ccWrap{perspective:1000px}
.cc{position:relative;height:200px;border-radius:22px;padding:22px;color:#fff;overflow:hidden;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;box-shadow:0 25px 50px -20px rgba(0,0,0,.7)}
.cc::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.35),transparent 45%),radial-gradient(circle at 0% 100%,rgba(0,0,0,.35),transparent 55%)}
.cc::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;animation:shine 6s linear infinite}
.cc>*{position:relative;z-index:1}
.cc .chipCC{width:44px;height:32px;border-radius:7px;background:linear-gradient(135deg,#F7E7A1,#C9A646);margin:18px 0 14px}
.cc .nm{font-weight:800;font-size:18px}
.cc .bd{position:absolute;right:22px;top:22px;font-weight:800;font-style:italic;font-size:17px;opacity:.95}
.cc .fat{font-size:26px;font-weight:800;letter-spacing:-.5px}
.cc .ft{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9;margin-top:4px}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
/* listas */
.lst{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid transparent;cursor:pointer;transition:.2s;opacity:0;animation:up .5s forwards}
.it:hover{border-color:var(--bd);background:var(--card2);transform:translateX(4px)}
.it .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx small{font-size:12px;color:var(--tx2)}
.it .vl{text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
.it .vl small{display:block;font-weight:600;font-size:11px;color:var(--tx3)}
.empty{text-align:center;padding:34px 10px;color:var(--tx3);font-size:14px}
.empty .ms{font-size:46px;display:block;margin-bottom:8px;opacity:.5}
/* insights */
.ins{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card);margin-bottom:8px;font-size:13.5px;line-height:1.45;border-left:3px solid var(--c);opacity:0;animation:up .5s forwards}
.ins .ms{color:var(--c);font-size:20px}
/* ranking categorias */
.rk{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.rk .pos{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--card2)}
.rk .pos.g1{background:linear-gradient(135deg,#FDE68A,#D97706);color:#3B2300}.rk .pos.g2{background:linear-gradient(135deg,#E5E7EB,#9CA3AF);color:#1F2937}.rk .pos.g3{background:linear-gradient(135deg,#FDBA74,#B45309);color:#3B1500}
.rk .bx{flex:1}
.rk .bx div{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .hd{font-size:10.5px;color:var(--tx3);text-align:center;font-weight:700}
.heat .c{aspect-ratio:1;border-radius:7px;background:var(--card2);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--tx2);cursor:pointer;transition:transform .2s}
.heat .c:hover{transform:scale(1.18);z-index:2}
.heat .c.vz{background:none;cursor:default}
.heat .c.hj{outline:2px solid var(--p2);outline-offset:1px}
/* botões / form */
.btn{border:0;border-radius:14px;padding:11px 18px;font:700 14px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s;background:var(--card2);color:var(--tx)}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 10px 25px -10px color-mix(in srgb,var(--p1) 90%,transparent)}
.btn.ghost{background:none;border:1px solid var(--bd)}
.btn.dng{background:rgba(239,68,68,.14);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn .ms{font-size:19px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fg .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--tx2)}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx);background:var(--bg2);border:1.5px solid var(--bd);border-radius:13px;padding:12px 14px;outline:none;transition:.2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p1);box-shadow:0 0 0 4px color-mix(in srgb,var(--p1) 18%,transparent)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.seg{display:flex;background:var(--bg2);border:1.5px solid var(--bd);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--tx2);font:700 13px inherit;font-family:inherit;padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff}
.valInput{font-size:30px !important;font-weight:800;text-align:center;letter-spacing:-1px;padding:16px !important}
/* modal */
.ov{position:fixed;inset:0;z-index:200;background:rgba(5,5,12,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex;animation:fade .25s}
.modal{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:28px;padding:26px;box-shadow:0 40px 100px -20px rgba(0,0,0,.7);animation:up .4s cubic-bezier(.2,1.2,.4,1)}
.modal .mh{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.modal .mh h2{font-size:21px;font-weight:800;letter-spacing:-.5px;flex:1}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
/* FAB */
.fab{position:fixed;right:24px;bottom:96px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab .main{width:62px;height:62px;border-radius:21px;border:0;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 18px 40px -10px color-mix(in srgb,var(--p1) 95%,transparent);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.fab .main .ms{font-size:32px}
.fab.open .main{transform:rotate(135deg)}
.fab .opt{display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:.3s cubic-bezier(.2,1.2,.4,1)}
.fab.open .opt{opacity:1;transform:none;pointer-events:auto}
.fab.open .opt:nth-child(2){transition-delay:.04s}.fab.open .opt:nth-child(3){transition-delay:.08s}.fab.open .opt:nth-child(4){transition-delay:.12s}
.fab .opt span{background:var(--bg2);border:1px solid var(--bd);padding:7px 12px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:var(--sh)}
.fab .opt button{width:48px;height:48px;border-radius:16px;border:0;cursor:pointer;color:#fff}
/* bottom nav mobile */
.bnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:80;background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:24px;padding:8px;justify-content:space-around;box-shadow:var(--sh)}
.bnav button{border:0;background:none;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10.5px inherit;font-family:inherit;padding:6px 8px;border-radius:14px;cursor:pointer}
.bnav button.on{color:#fff;background:var(--grad)}
/* drawer notificações */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:210;background:var(--bg2);border-left:1px solid var(--bd);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px -30px rgba(0,0,0,.6)}
.drawer.on{transform:none}
.drawer .dh{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.drawer .dh h2{flex:1;font-size:19px;font-weight:800}
.drawer .db{flex:1;overflow:auto;padding:14px}
.nt{padding:14px;border-radius:16px;background:var(--card);margin-bottom:8px;display:flex;gap:12px;opacity:0;animation:up .4s forwards}
.nt.nova{border:1px solid rgba(139,92,246,.4);background:rgba(139,92,246,.08)}
.nt b{font-size:14px}.nt p{font-size:13px;color:var(--tx2);margin-top:3px;line-height:1.4}.nt small{font-size:11px;color:var(--tx3)}
/* scanner */
.drop{border:2px dashed var(--bd);border-radius:22px;padding:34px 20px;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.drop:hover,.drop.drag{border-color:var(--p1);background:rgba(139,92,246,.07)}
.drop .ms{font-size:54px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.scanPrev{position:relative;border-radius:18px;overflow:hidden;max-height:340px;display:none;margin-bottom:16px}
.scanPrev img{width:100%;max-height:340px;object-fit:contain;background:#000;display:block}
.scanPrev .ln{position:absolute;left:4%;right:4%;height:3px;background:var(--p2);box-shadow:0 0 22px 6px rgba(6,182,212,.7);border-radius:9px;animation:scan 2.2s ease-in-out infinite;display:none}
.scanPrev.lendo .ln{display:block}
.scanPrev.lendo img{filter:brightness(.7) saturate(1.2)}

<!-- ================================================================
PARTE 2/4 — Núcleo JS (estado, API, animações) + página Início
================================================================ -->
<script>
var S = { mes: '', d: null, pg: 'inicio', charts: {}, tema: '<?= temaModo ?>' || 'dark', cor: '<?= temaCor ?>' || 'violeta', custom: '<?= temaCustom ?>', email: String('<?= email ?>').toLowerCase(), lanc: null, scan: null };
var PALETAS = { violeta: ['Violeta', '#8B5CF6', '#06B6D4', '#EC4899'], oceano: ['Oceano', '#0EA5E9', '#22D3EE', '#6366F1'], esmeralda: ['Esmeralda', '#10B981', '#06B6D4', '#84CC16'], sunset: ['Pôr do sol', '#F97316', '#EF4444', '#F59E0B'], rosa: ['Rosa', '#EC4899', '#F43F5E', '#A855F7'], dourado: ['Dourado', '#EAB308', '#F59E0B', '#B45309'], rubi: ['Rubi', '#E11D48', '#9F1239', '#F97316'], aurora: ['Aurora', '#22C55E', '#3B82F6', '#A855F7'], grafite: ['Grafite', '#94A3B8', '#64748B', '#38BDF8'] };
var PAGS = [
  ['inicio', 'space_dashboard', 'Início'], ['cartoes', 'credit_card', 'Cartões'], ['parcelas', 'splitscreen', 'Parcelas'],
  ['financ', 'account_balance', 'Financiamentos'], ['receitas', 'payments', 'Salário & Pró-labore'], ['lanc', 'receipt_long', 'Lançamentos'],
  ['lembretes', 'forum', 'Contador'], ['metas', 'flag', 'Metas'], ['config', 'tune', 'Config']
];
var BNAV = ['inicio', 'cartoes', 'lanc', 'lembretes', 'config'];
var CORES = ['#8B5CF6', '#06B6D4', '#EC4899', '#10B981', '#F59E0B', '#EF4444', '#3B82F6', '#A855F7', '#14B8A6', '#F97316', '#84CC16', '#E11D48'];
var ICAT = { 'Alimentação': 'lunch_dining', 'Mercado': 'shopping_cart', 'Restaurante': 'restaurant', 'Transporte': 'directions_car', 'Combustível': 'local_gas_station', 'Moradia': 'home', 'Contas da casa': 'bolt', 'Saúde': 'favorite', 'Farmácia': 'medication', 'Educação': 'school', 'Lazer': 'sports_esports', 'Viagem': 'flight', 'Assinaturas': 'subscriptions', 'Compras': 'shopping_bag', 'Vestuário': 'checkroom', 'Eletrônicos': 'devices', 'Pets': 'pets', 'Presentes': 'redeem', 'Impostos': 'gavel', 'Empresa': 'business_center', 'Financiamento': 'account_balance', 'Outros': 'category' };

// ---------- utilitários ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function brl(v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function brlK(v) { v = Number(v) || 0; return Math.abs(v) >= 1000 ? 'R$ ' + (v / 1000).toFixed(1).replace('.', ',') + 'k' : brl(v); }
function num(v) { if (typeof v === 'number') return v; var s = String(v || '').replace(/[R$\s]/g, ''); if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s) || 0; }
function nomeMes(ym, longo) { var n = longo ? ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'] : ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return n[Number(ym.substring(5, 7)) - 1] + (longo ? ' ' + ym.substring(0, 4) : '/' + ym.substring(2, 4)); }
function somaMes(ym, n) { var d = new Date(Number(ym.substring(0, 4)), Number(ym.substring(5, 7)) - 1 + n, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function hojeISO() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dataBR(s) { s = String(s || '').substring(0, 10); return s.length === 10 ? s.substring(8, 10) + '/' + s.substring(5, 7) + '/' + s.substring(0, 4) : s; }
function corCat(c) { var i = 0, s = String(c); for (var k = 0; k < s.length; k++) i += s.charCodeAt(k); return CORES[i % CORES.length]; }
function icCat(c) { return ICAT[c] || 'category'; }
function hexA(h, a) { h = h.replace('#', ''); return 'rgba(' + parseInt(h.substring(0, 2), 16) + ',' + parseInt(h.substring(2, 4), 16) + ',' + parseInt(h.substring(4, 6), 16) + ',' + a + ')'; }
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {} }

// ---------- API com timeout de segurança (30s) ----------
function api(fn, args, ok, falha) {
  var feito = false;
  var t = setTimeout(function () { if (feito) return; feito = true; toast('Tempo esgotado. Tente de novo.', 'bad'); esconderLoader(); if (falha) falha('timeout'); }, 30000);
  var r = google.script.run.withSuccessHandler(function (txt) {
    if (feito) return; feito = true; clearTimeout(t);
    var j; try { j = JSON.parse(txt); } catch (e) { j = { ok: false, erro: 'Resposta inválida' }; }
    if (!j.ok) { toast(j.erro || 'Erro', 'bad'); esconderLoader(); if (falha) falha(j.erro); return; }
    if (ok) ok(j);
  }).withFailureHandler(function (e) {
    if (feito) return; feito = true; clearTimeout(t);
    toast(String(e.message || e), 'bad'); esconderLoader(); if (falha) falha(e);
  });
  r[fn].apply(r, args || []);
}

function toast(msg, tipo) {
  var ic = tipo === 'bad' ? 'error' : tipo === 'warn' ? 'warning' : 'check_circle';
  var cor = tipo === 'bad' ? 'var(--bad)' : tipo === 'warn' ? 'var(--warn)' : 'var(--ok)';
  var el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = '<span class="ms" style="color:' + cor + '">' + ic + '</span>' + esc(msg);
  $('toasts').appendChild(el);
  setTimeout(function () { el.style.transition = '.4s'; el.style.opacity = '0'; el.style.transform = 'translateY(-10px)'; }, 3200);
  setTimeout(function () { el.remove(); }, 3700);
}
function esconderLoader() { $('loader').classList.add('out'); }

// números com contagem progressiva
function animar(root) {
  (root || document).querySelectorAll('[data-n]').forEach(function (el) {
    var alvo = Number(el.getAttribute('data-n')) || 0, tipo = el.getAttribute('data-f') || 'brl', ini = null, dur = 1300;
    function f(v) { return tipo === 'int' ? Math.round(v) : tipo === 'pct' ? v.toFixed(1).replace('.', ',') + '%' : brl(v); }
    function passo(ts) { if (!ini) ini = ts; var p = Math.min(1, (ts - ini) / dur); var e = 1 - Math.pow(1 - p, 4); el.textContent = f(alvo * e); if (p < 1) requestAnimationFrame(passo); }
    requestAnimationFrame(passo);
  });
  setTimeout(function () {
    (root || document).querySelectorAll('[data-w]').forEach(function (el) { el.style.width = Math.max(0, Math.min(100, Number(el.getAttribute('data-w')))) + '%'; });
  }, 80);
}
function stagger(root) { (root || document).querySelectorAll('.card,.it,.ins,.nt').forEach(function (el, i) { el.style.animationDelay = Math.min(i * 45, 700) + 'ms'; }); }

function confete() {
  for (var i = 0; i < 90; i++) {
    var c = document.createElement('i'); c.className = 'cft';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = CORES[i % CORES.length];
    document.body.appendChild(c);
    var dx = (Math.random() - .5) * 300, rot = Math.random() * 900;
    c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: 'translate(' + dx + 'px,' + (window.innerHeight + 40) + 'px) rotate(' + rot + 'deg)', opacity: .8 }], { duration: 1800 + Math.random() * 1600, easing: 'cubic-bezier(.2,.6,.4,1)' });
    (function (x) { setTimeout(function () { x.remove(); }, 3600); })(c);
  }
}

// ---------- tema / navegação ----------
function aplicarTema() { aplicarCor(); setTimeout(function () { try { avisarCasca(); } catch (e) {} }, 60); document.body.classList.toggle('light', S.tema === 'light'); $('temaIc').textContent = S.tema === 'light' ? 'dark_mode' : 'light_mode'; }
function toggleTema() { S.tema = S.tema === 'light' ? 'dark' : 'light'; aplicarTema(); salvarTema(); if (S.d) render(); }
function paleta() { if (S.cor === 'custom' && S.custom) { var c = S.custom.split(','); return ['Personalizado', c[0] || '#8B5CF6', c[1] || c[0] || '#06B6D4', c[2] || c[1] || '#EC4899']; } return PALETAS[S.cor] || PALETAS.violeta; }
function corP(i) { return paleta()[i]; }
function aplicarCor() { var p = paleta(), r = document.documentElement.style; r.setProperty('--p1', p[1]); r.setProperty('--p2', p[2]); r.setProperty('--p3', p[3]); }
function salvarTema() { api('apiSalvarConfig', [{ TEMA_COR: S.cor, TEMA_MODO: S.tema, TEMA_CUSTOM: S.custom }], function () {}); }
function escolherCor(k) { S.cor = k; aplicarTema(); salvarTema(); if (S.d) render(); toast('Tema ' + paleta()[0] + ' aplicado'); }
function setModo(m) { S.tema = m; aplicarTema(); salvarTema(); if (S.d) render(); }
function corCustom() { S.custom = [$('tc1').value, $('tc2').value, $('tc3').value].join(','); S.cor = 'custom'; aplicarTema(); salvarTema(); if (S.d) render(); }

function montarNav() {
  $('pills').innerHTML = PAGS.map(function (p) { return '<button data-p="' + p[0] + '" onclick="ir(\'' + p[0] + '\')"><span class="ms">' + p[1] + '</span>' + p[2] + '</button>'; }).join('');
  $('bnav').innerHTML = BNAV.map(function (k) { var p = PAGS.filter(function (x) { return x[0] === k; })[0]; return '<button data-p="' + k + '" onclick="ir(\'' + k + '\')"><span class="ms">' + p[1] + '</span>' + p[2].split(' ')[0] + '</button>'; }).join('') +
    '<button onclick="menuMais()"><span class="ms">apps</span>Mais</button>';
}
function ir(pg) {
  S.pg = pg; vib(8);
  document.querySelectorAll('.page').forEach(function (e) { e.classList.remove('on'); });
  $('pg-' + pg).classList.add('on');
  document.querySelectorAll('[data-p]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === pg); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}
function menuMais() {
  abrirModal('<div class="mh"><span class="ms" style="color:var(--p1)">apps</span><h2>Menu</h2><button class="icBtn" onclick="fecharModal()"><span class="ms">close</span></button></div><div class="grid g2">' +
    PAGS.map(function (p) { return '<div class="card click" style="opacity:1;animation:none" onclick="fecharModal();ir(\'' + p[0] + '\')"><span class="ms" style="color:var(--p1);font-size:28px">' + p[1] + '</span><div style="font-weight:800;margin-top:8px">' + p[2] + '</div></div>'; }).join('') + '</div>');
}
function mudarMes(n) { S.mes = somaMes(S.mes, n); carregar(); }
function fabFechar() { $('fab').classList.remove('open'); }

// ---------- modal ----------
function abrirModal(html) { $('modal').innerHTML = '<div class="grab"></div>' + html; try { google.script.history.push({ m: 1 }); } catch (e) {} $('ov').classList.add('on'); fabFechar(); }
function fecharModal() { $('ov').classList.remove('on'); }

// ---------- carga ----------
function carregar(silencioso) {
  $('mesTxt').textContent = nomeMes(S.mes);
  if (!silencioso && S.d) document.querySelectorAll('.page.on .card').forEach(function (c) { c.style.opacity = '.45'; });
  api('apiPainel', [S.mes], function (d) {
    if (!d.usuario || d.usuario !== S.email) { bloquearTela(d.usuario); return; }
    S.d = d; S.lanc = null; esconderLoader(); if (d.versao && d.versao !== VER_INI) mostrarUpd(d.versao);
    var n = d.naoLidas; $('nBadge').style.display = n ? 'grid' : 'none'; $('nBadge').textContent = n > 9 ? '9+' : n;
    render(); renderNotifs();
  });
}
function render() {
  if (!S.d) return;
  var f = { inicio: rInicio, cartoes: rCartoes, parcelas: rParcelas, financ: rFinanc, receitas: rReceitas, lanc: rLanc, lembretes: rLembretes, metas: rMetas, config: rConfig }[S.pg];
  Object.keys(S.charts).forEach(function (k) { try { S.charts[k].destroy(); } catch (e) {} }); S.charts = {};
  f(); var pg = $('pg-' + S.pg); stagger(pg); animar(pg);
}

// ---------- gráficos ----------
function corTx() { return getComputedStyle(document.body).getPropertyValue('--tx2').trim() || '#A1A1B5'; }
function corGrid() { return S.tema === 'light' ? 'rgba(20,20,50,.06)' : 'rgba(255,255,255,.06)'; }
function grafico(id, cfg) {
  var el = $(id); if (!el || typeof Chart === 'undefined') return;
  Chart.defaults.font.family = 'Plus Jakarta Sans'; Chart.defaults.color = corTx();
  S.charts[id] = new Chart(el.getContext('2d'), cfg);
}
function gradV(ctx, c1) { var g = ctx.createLinearGradient(0, 0, 0, 280); g.addColorStop(0, hexA(c1, .45)); g.addColorStop(1, hexA(c1, 0)); return g; }

// ================= PÁGINA INÍCIO =================
function kpi(lbl, ic, cor, valor, sub, onclick, fmt) {
  return '<div class="card kpi click" onclick="' + (onclick || '') + '"><i class="bar" style="background:' + cor + '"></i><div class="ico" style="background:' + hexA(cor, .15) + ';color:' + cor + '"><span class="ms">' + ic + '</span></div>' +
    '<div class="lbl">' + lbl + '</div><div class="val" data-n="' + valor + '" data-f="' + (fmt || 'brl') + '">' + brl(0) + '</div><div class="sub">' + (sub || '') + '</div></div>';
}
function rInicio() {
  var d = S.d, k = d.kpis;
  var varAnt = k.mesAnterior ? (k.gastos - k.mesAnterior) / k.mesAnterior * 100 : 0;
  var hora = new Date().getHours(), saud = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  var pctGasto = k.receita ? k.gastos / k.receita * 100 : 0;
  var tot = Math.max(k.receita, k.gastos) || 1;
  var corScore = k.score >= 70 ? '#10B981' : k.score >= 45 ? '#F59E0B' : '#EF4444';

function vazio(ic, t) { return '<div class="empty"><span class="ms">' + ic + '</span>' + t + '</div>'; }

function heatmap() {

function itemLanc(l) {

function proxVenc() {

// ================= SCANNER DE NOTA FISCAL =================
function abrirScanner() {
  abrirModal(cab('document_scanner', 'var(--p3)', 'Escanear nota fiscal') +
    '<div class="scanPrev" id="scPrev"><img id="scImg"><div class="ln"></div></div>' +
    '<div class="drop" id="drop" onclick="$(\'fileNota\').click()"><span class="ms">add_a_photo</span><div style="font-weight:800;font-size:17px;margin-top:6px">Tirar foto ou escolher arquivo</div><div style="font-size:13px;color:var(--tx2);margin-top:4px">Nota, cupom, comprovante ou PDF · o app preenche o gasto pra você</div></div>' +
    '<div id="scSt" style="margin-top:14px;text-align:center"><span class="aiTag"><span class="ms" style="font-size:15px">auto_awesome</span>' + (S.d.temIA ? 'Leitura com IA ativada' : 'Leitura por OCR · ative a IA grátis em Config') + '</span></div>');
  var dp = $('drop');
  ['dragover', 'dragenter'].forEach(function (e) { dp.addEventListener(e, function (ev) { ev.preventDefault(); dp.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (e) { dp.addEventListener(e, function (ev) { ev.preventDefault(); dp.classList.remove('drag'); }); });
  dp.addEventListener('drop', function (ev) { if (ev.dataTransfer.files[0]) processarArquivo(ev.dataTransfer.files[0]); });
}
function processarArquivo(file) {
  if (!file) return;
  var pdf = file.type.indexOf('pdf') > -1;
  var fr = new FileReader();
  fr.onload = function () {
    if (pdf) return enviarNota(String(fr.result).split(',')[1], 'application/pdf', null);
    var img = new Image();
    img.onload = function () { // reduz a foto para ficar rápida (máx 1600px)
      var esc2 = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * esc2); cv.height = Math.round(img.height * esc2);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var url = cv.toDataURL('image/jpeg', .85); enviarNota(url.split(',')[1], 'image/jpeg', url);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function enviarNota(b64, mime, preview) {
  if (!$('scPrev')) abrirScanner();
  if (preview) { $('scImg').src = preview; $('scPrev').style.display = 'block'; }
  $('scPrev').classList.add('lendo'); $('drop').style.display = 'none';
  var etapas = ['Enviando foto…', 'Lendo a nota…', 'Identificando loja e valores…', 'Separando categoria…'], i = 0;
  $('scSt').innerHTML = '<div class="aiTag" id="scMsg"><span class="ms" style="font-size:15px;animation:spin 1.2s linear infinite">progress_activity</span>' + etapas[0] + '</div>';
  var tm = setInterval(function () { i = Math.min(etapas.length - 1, i + 1); var m = $('scMsg'); if (m) m.lastChild.textContent = etapas[i]; }, 1800);
  api('apiLerNota', [b64, mime], function (r) {
    clearInterval(tm); vib([20, 40, 20]);
    if (r.avisoIA) toast(r.avisoIA, 'warn');
    toast(r.VALOR ? 'Nota lida! Confira os dados' : 'Não achei o valor, complete manualmente', r.VALOR ? '' : 'warn');
    abrirLanc(null, { VALOR: r.VALOR, DESCRICAO: r.DESCRICAO, DATA: r.DATA, CATEGORIA: r.CATEGORIA, FORMA: r.FORMA || '', TOTAL_PARCELAS: r.TOTAL_PARCELAS, ESTABELECIMENTO: r.ESTABELECIMENTO, NOTA_URL: r.NOTA_URL, OBS: (r.ITENS || []).slice(0, 8).map(function (x) { return x.nome; }).join(', '), _metodo: r.metodo });
  }, function () { clearInterval(tm); if ($('scPrev')) $('scPrev').classList.remove('lendo'); if ($('drop')) $('drop').style.display = ''; });
}

function mostrarUpd(v) {
  if ($('updBar')) return;

function initMobile() {
  var ind = document.createElement('div'); ind.id = 'ptr'; ind.innerHTML = '<span class="ms">refresh</span>'; document.body.appendChild(ind);
  var y0 = null, dy = 0;
  document.addEventListener('touchstart', function (e) { if (window.scrollY > 0 || $('ov').classList.contains('on') || $('drawer').classList.contains('on')) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  document.addEventListener('touchmove', function (e) { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 4) { var p = Math.min(dy, 120); ind.style.transform = 'translate(-50%,' + (p * 0.7) + 'px) rotate(' + (p * 3) + 'deg)'; ind.style.opacity = Math.min(1, p / 70); ind.classList.toggle('pronto', p >= 90); } }, { passive: true });
  document.addEventListener('touchend', function () { if (y0 === null) return; if (dy >= 90) { ind.classList.add('girando'); vib(15); carregar(true); setTimeout(function () { ind.classList.remove('girando'); }, 1300); } ind.style.transform = ''; ind.style.opacity = '0'; ind.classList.remove('pronto'); y0 = null; });
  var m = $('modal'), my = null, md = 0;
  m.addEventListener('touchstart', function (e) { if (m.scrollTop > 0 || window.innerWidth > 760) { my = null; return; } my = e.touches[0].clientY; md = 0; m.style.transition = 'none'; }, { passive: true });
  m.addEventListener('touchmove', function (e) { if (my === null) return; md = Math.max(0, e.touches[0].clientY - my); m.style.transform = 'translateY(' + md + 'px)'; }, { passive: true });
  m.addEventListener('touchend', function () { if (my === null) return; m.style.transition = 'transform .3s'; if (md > 120) { m.style.transform = 'translateY(100%)'; setTimeout(function () { fecharModal(); m.style.transform = ''; }, 250); } else { m.style.transform = ''; } my = null; });
  try { google.script.history.setChangeHandler(function () { if ($('ov').classList.contains('on')) fecharModal(); else if ($('drawer').classList.contains('on')) fecharNotifs(); }); } catch (e) {}
}
